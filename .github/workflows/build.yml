name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.0.4

            #### 🚨 CRITICAL FIX: Print button crash on 'QSizeF is not defined'

            The v2.0.3 release had a missing import — `QSizeF` was being
            used in `main_window.py` (in `_do_test_print`, `on_quick_print_clicked`,
            and `on_preview_clicked`) but was never imported! This caused
            the Print button to fail with `NameError: name 'QSizeF' is not defined`
            on every Windows system.

            Fix: Added `QSizeF` to the `from PyQt5.QtCore import ...` statement.

            I'm very sorry this took 4 releases to fix — the root cause was
            an inadequate test that didn't actually invoke the print code path
            on a real PyQt5 install. I've now added a comprehensive import
            audit test (`scripts/test_imports.py`) that checks every Qt class
            used in the codebase against the imports in each file. This
            prevents any future 'X is not defined' bugs from reaching users.

            #### New: Preview now shows actual sticker size with ruler

            The preview pane now displays:
            - A bold header showing "Sticker size: 38.1 × 25.4 mm (1.50 × 1.00 in)"
            - Ruler ticks (cm and mm marks) along the top and left of the paper
            - For label mode: dimension lines on the sticker showing actual
              width and height (e.g. "37.1 mm" and "24.4 mm")
            - Gray background so the white paper/sticker is clearly visible

            This lets you verify the sticker size at a glance — you can even
            hold your physical label up to the screen to confirm it matches.

            #### Earlier features (still included)
            - Custom Print Setup Dialog (replaces unreliable QPrintDialog)
            - Quick Print button — sends to default printer
            - Test Print button — print 1 label as test
            - Printer info display with ✓/✗ match indicator
            - Diagnostic info in error messages
            - setFullPage(True) for proper label printing
            - 13 preset label sizes including 1.5×1 inch (user's label)
            - Interactive Sticker Layout Editor with drag, resize, rotate
            - Keyboard arrow keys nudge elements (1mm / 0.1mm with Shift)
            - Delete key disables element
            - Barcode optional (Include Barcode toggle)
            - Save as PDF — always works
            - mm / inches unit toggle
            - Per-element font family, size, bold, italic, color, alignment
            - EAN-13 barcode generator
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (Zebra, TSC, Xprinter, Godex, Rongta)
            - Company name, product name, product code, Mfg/Exp dates, mobile
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
