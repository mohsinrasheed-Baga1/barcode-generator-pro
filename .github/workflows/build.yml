name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            --hidden-import PyQt5.QtWidgets ^
            --hidden-import PyQt5.QtGui ^
            --hidden-import PyQt5.QtCore ^
            --hidden-import barcode ^
            --hidden-import barcode.ean ^
            --hidden-import barcode.writer ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
              Installs to `Program Files\Barcode Generator Pro`,
              creates Start Menu + Desktop shortcuts.
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.0.1

            #### Bug fixes:
            - **Fixed**: Sticker editor — drag/arrow keys now correctly move elements
              (previously element positions didn't update properly during drag,
              so only "slight movement" was possible).
            - **Fixed**: Text in sticker elements no longer gets clipped
              (added Qt.TextDontClip flag to drawText).
            - **Fixed**: Print button now properly asks which printer + how many
              copies (added a friendly setup dialog before the system print dialog).
            - **Fixed**: Copy count no longer overridden to 1 when print dialog returns.
            - **Improved**: Use QPrinter.PrinterResolution for better compatibility
              with label printers (Zebra, TSC, Xprinter, Godex).
            - **Added**: Status bar messages confirm print job submission with
              printer name and copy count.
            - **Added**: Keyboard arrow keys nudge selected element (1mm normal,
              0.1mm with Shift). Delete/Backspace disables element.
            - **Added**: Success message after print submission with troubleshooting
              tips if print doesn't come out.

            ### What's new in v2.0.0
            - Interactive Sticker Layout Editor — drag, resize, rotate any element
            - Barcode optional (Include Barcode toggle)
            - Save as PDF button — always works, no printer needed
            - mm / inches unit toggle in Settings
            - Per-element font family, size, bold, italic, color, alignment
            - Better error messages with "Save as PDF" fallback

            ### Older features (still included)
            - EAN-13 barcode generator with checksum validation
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (direct — Zebra, TSC, Xprinter, Godex, etc.)
              with 7 preset label sizes + custom size
            - Company name, product name, product code, Mfg/Exp dates, mobile number
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
