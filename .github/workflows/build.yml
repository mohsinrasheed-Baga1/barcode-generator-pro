name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.1.0

            #### 🖼 New: Logo support
            - Added "Add Logo" button in the main window
            - Load any PNG/JPEG/BMP/GIF image as a logo on the sticker
            - Logo is stored as base64 in the template (persisted across sessions)
            - Three fit modes: Contain (full image visible), Cover (fill, may crop), Stretch
            - Resize/reposition logo using the inline editor

            #### ✏ New: Inline sticker editor (no more separate dialog)
            - The sticker editor is now embedded in the main window
            - Click "✏ Edit Layout (inline)" button to toggle edit mode
            - The preview area becomes interactive — click any element to select
            - Drag to move, use property panel to resize/rotate
            - All controls (font, color, alignment, image) are right there
            - No more opening a separate dialog window

            #### 🖨 Beautiful Print button
            - Print button now has a prominent orange/red gradient — stands out
            - Quick Print: green gradient
            - Save as PDF: amber gradient
            - All buttons have hover/pressed states for professional feel

            #### 🔍 Zoom controls for preview
            - Zoom In / Zoom Out buttons
            - "1:1 (Actual Size)" — shows sticker at physical size (1mm screen = 1mm paper)
            - "Fit" — fits preview to window
            - Current zoom percentage displayed
            - Useful for verifying the sticker matches the physical label

            #### 📐 Preview improvements
            - Preview now renders at a more realistic size (not too big)
            - User can zoom in/out to inspect details
            - Barcode now displays fully in preview (fixed cutting issue)
              - Computed module_width based on element rect width
              - 113 modules fit in 95% of rect width
            - Better ruler ticks (cm + mm marks) and dimension lines

            #### ✨ UI polish
            - Gradient buttons with hover/pressed states
            - Better spacing and grouping of controls
            - More professional, modern look

            #### Earlier features (still included)
            - Custom Print Setup Dialog with printer list + match indicator
            - Test Print button (print 1 label as test)
            - setFullPage(True) for proper label printing
            - 13 preset label sizes (mm + inches), including 1.5×1 inch
            - Quick Print button — sends to default printer
            - Save as PDF — always works
            - mm / inches unit toggle
            - Per-element font family, size, bold, italic, color, alignment
            - EAN-13 barcode generator
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (Zebra, TSC, Xprinter, Godex, Rongta)
            - Company name, product name, product code, Mfg/Exp dates, mobile
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)
            - Import audit test (prevents 'X is not defined' bugs)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
