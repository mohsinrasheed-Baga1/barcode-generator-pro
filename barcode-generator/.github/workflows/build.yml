name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.2.0

            #### 🖌️ Illustrator-like interactive editor
            - Each element on the canvas now has 9 handles:
              * 4 corner handles (top-left, top-right, bottom-left, bottom-right) — resize both dimensions
              * 4 edge handles (top, bottom, left, right) — resize one dimension
              * 1 rotate handle above the top edge — rotate to any angle
            - Drag the body to move (cursor: SizeAllCursor)
            - Drag any corner to resize (cursor: SizeFDiagCursor / SizeBDiagCursor)
            - Drag edges to resize one dimension (cursor: SizeHorCursor / SizeVerCursor)
            - Drag rotate handle to rotate (cursor: CrossCursor)
            - Cursor changes on hover to indicate what action is available
            - Resize respects the opposite corner/edge — it stays fixed during resize
            - Rotation is preserved during resize

            #### 📱 Responsive UI (fixes "size distributed" issue)
            - Window now uses QSplitter — user can drag the divider to resize panels
            - Both left (input form) and right (preview) panels are in scroll areas
            - Minimum window size 900x600 — UI works on small screens too
            - On small screens, panels scroll instead of getting squished
            - On large screens, panels expand to fill space
            - Fixed the issue where UI looked "distributed/broken" on smaller screens

            #### 🎯 Better element selection
            - Click on any element to select it
            - Handles become visible only when selected (clean canvas otherwise)
            - Selection border is solid blue; unselected is dashed gray
            - Line from top edge to rotate handle for clear visibility

            #### ⌨️ Keyboard shortcuts
            - Arrow keys: nudge selected element 1mm
            - Shift + Arrow: nudge 0.1mm (fine control)
            - Delete / Backspace: disable selected element

            #### Earlier features (still included)
            - 🖼 Logo support (PNG/JPEG/BMP/GIF)
            - ✏ Inline editor (no separate dialog)
            - 🖨 Beautiful gradient Print button (orange/red)
            - ⚡ Quick Print button (green)
            - 📄 Save as PDF button (amber)
            - 🔍 Zoom controls (In/Out/Actual Size/Fit)
            - 📐 Preview at actual sticker size
            - 📊 Barcode displays fully in preview
            - Custom Print Setup Dialog with printer list + match indicator
            - Test Print button (print 1 label as test)
            - setFullPage(True) for proper label printing
            - 13 preset label sizes (mm + inches), including 1.5×1 inch
            - mm / inches unit toggle
            - Per-element font family, size, bold, italic, color, alignment
            - EAN-13 barcode generator
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (Zebra, TSC, Xprinter, Godex, Rongta)
            - Company name, product name, product code, Mfg/Exp dates, mobile
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)
            - Import audit test (prevents 'X is not defined' bugs)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
