name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.3.0

            #### 🏷 Speed-X SP 700U presets
            - **110×25 mm sheet (3 stickers per row)** — prints 3 stickers of 32×25mm each on one 110×25mm label
              * Layout: [32mm sticker] [5mm gap] [32mm sticker] [5mm gap] [32mm sticker]
              * Total: 2 + 32 + 5 + 32 + 5 + 32 + 2 = 110mm ✓
            - **32×25 mm single sticker** — for printing one sticker at a time
            - Both presets marked with ★ in the dropdown for easy identification

            #### 📊 CRITICAL FIX: Barcode not visible
            - **Root cause:** `module_width` and `module_height` were being passed
              to python-barcode in **device pixels** instead of **millimeters**.
              python-barcode expects these in mm, so the barcode was being
              generated at the wrong physical size, causing it to either
              not show or render incorrectly.
            - **Fix:** Now using `elem.w_mm` and `elem.h_mm` (the element's
              physical dimensions in mm) to compute module dimensions:
              * `module_w_mm = (elem.w_mm * 0.95) / 113` (113 = EAN-13 modules)
              * `module_h_mm = elem.h_mm * 0.75`
            - Barcode is now correctly sized and visible on all sticker sizes.

            #### 📊 Barcode error display
            - If barcode generation fails (e.g., invalid digits), the error
              message is now displayed on the sticker instead of silently
              showing nothing.

            #### Earlier features (still included)
            - 🖌️ Illustrator-like editor (9 handles: 4 corners + 4 edges + 1 rotate)
            - 📱 Responsive UI (QSplitter + scrollable panels)
            - 🖼 Logo support (PNG/JPEG/BMP/GIF)
            - ✏ Inline editor (no separate dialog)
            - 🖨 Beautiful gradient Print button (orange/red)
            - ⚡ Quick Print button (green)
            - 📄 Save as PDF button (amber)
            - 🔍 Zoom controls (In/Out/Actual Size/Fit)
            - Custom Print Setup Dialog with printer list + match indicator
            - Test Print button (print 1 label as test)
            - setFullPage(True) for proper label printing
            - 15 preset label sizes (mm + inches + Speed-X SP 700U)
            - mm / inches unit toggle
            - Per-element font family, size, bold, italic, color, alignment
            - EAN-13 barcode generator
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (Zebra, TSC, Xprinter, Godex, Rongta, Speed-X)
            - Company name, product name, product code, Mfg/Exp dates, mobile
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
