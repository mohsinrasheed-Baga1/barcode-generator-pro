name: Build Barcode Generator Pro (Windows)

# Triggers:
#   1. Push to main/master — build & upload artifacts (no release)
#   2. Tag push (v*) — build & create GitHub Release with the installer
#   3. Manual dispatch from Actions tab

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# Required permissions: write contents (for releases) + actions (for logs)
permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- Check out
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Display Python & pip versions
        run: |
          python --version
          pip --version

      # ---------------------------------------------------------------- Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyInstaller
        run: pyinstaller --version

      # ---------------------------------------------------------------- Build EXE
      - name: Build standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
            --onefile ^
            --windowed ^
            --name "BarcodeGeneratorPro" ^
            --icon "assets/icon.ico" ^
            --add-data "assets;assets" ^
            --collect-all PyQt5 ^
            --collect-all barcode ^
            --hidden-import PyQt5.QtPrintSupport ^
            --hidden-import PyQt5.QtSvg ^
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\BarcodeGeneratorPro.exe")) {
            throw "PyInstaller output not found: dist\BarcodeGeneratorPro.exe"
          }
          $size = (Get-Item "dist\BarcodeGeneratorPro.exe").Length
          Write-Host "Built EXE size: $size bytes"

      # ---------------------------------------------------------------- Inno Setup
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup not installed"
          }

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if not exist "dist\BarcodeGeneratorPro_Setup.exe" (
            echo ERROR: Installer was not produced
            exit /b 1
          )

      - name: List dist folder
        shell: pwsh
        run: Get-ChildItem dist

      # ---------------------------------------------------------------- Artifacts
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-EXE
          path: dist/BarcodeGeneratorPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeGeneratorPro-Installer
          path: dist/BarcodeGeneratorPro_Setup.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BarcodeGeneratorPro.exe
            dist/BarcodeGeneratorPro_Setup.exe
          name: Barcode Generator Pro ${{ github.ref_name }}
          body: |
            ## Barcode Generator Pro ${{ github.ref_name }}

            ### Downloads
            - **BarcodeGeneratorPro_Setup.exe** — Windows installer (recommended)
            - **BarcodeGeneratorPro.exe** — Standalone executable (no install needed)

            ### What's new in v2.0.3

            #### 🛠 CRITICAL FIX: Direct print not coming out + label size mismatch

            **Root cause:** `setFullPage(True)` was missing — Qt adds its own
            "hard margins" (3-5mm) by default, which on a 25mm tall label
            consumes 12-20% of the label area. Also, the user's actual label
            (1.5"×1" = 38.1×25.4mm) didn't match any preset — they were using
            a 50×30mm preset which caused the print to be cut off.

            **Fixes:**
            - Added `printer.setFullPage(True)` in `print_sticker_sheet` and
              `export_to_pdf` — now Qt uses the FULL physical page (no auto
              margins) — critical for label printers!
            - Added 6 new inch-based label presets:
              * **1.5 × 1 inch (38.1 × 25.4 mm) — آپ کا لیبل**
              * 2 × 1 inch (50.8 × 25.4 mm)
              * 3 × 1 inch (76.2 × 25.4 mm)
              * 3 × 2 inch (76.2 × 50.8 mm)
              * 4 × 2 inch (101.6 × 50.8 mm)
              * 4 × 6 inch (101.6 × 152.4 mm) — US shipping label

            #### New: Test Print button
            - The Print Setup dialog now has a "🧪 Test Print" button
            - Prints exactly 1 label as a test, so you can verify the
              setup before printing all your labels

            #### New: Printer info display with match indicator
            - The dialog shows the selected printer's actual page size
            - Green "✓ MATCHES layout" indicator when sizes match
            - Red "✗ مختلف — printer پر size درست کریں" warning when sizes differ
            - Shows printer resolution (DPI) for diagnostics

            #### New: Diagnostic info in error messages
            - All print error messages now include:
              * Printer name
              * Actual page size vs required layout size
              * Match status
              * Resolution (DPI)
              * Copies count
              * Full-page mode
            - This makes it much easier to diagnose print issues

            #### Earlier features (still included)
            - Custom Print Setup Dialog (replaces unreliable QPrintDialog)
            - Quick Print button — sends to default printer
            - Interactive Sticker Layout Editor with drag, resize, rotate
            - Keyboard arrow keys nudge elements (1mm / 0.1mm with Shift)
            - Delete key disables element
            - Barcode optional (Include Barcode toggle)
            - Save as PDF — always works
            - mm / inches unit toggle
            - Per-element font family, size, bold, italic, color, alignment
            - EAN-13 barcode generator
            - Sheet printer mode (A4 — 40/24/80/12 stickers per sheet)
            - Label printer mode (Zebra, TSC, Xprinter, Godex, Rongta)
              with 13 preset label sizes + custom size
            - Company name, product name, product code, Mfg/Exp dates, mobile
            - Bulk CSV import
            - SQLite history (search + reuse)
            - Bilingual UI (English + Urdu)

            See `README.txt` in the repo for full instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
